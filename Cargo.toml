[package]
name = "vaulet_core"
version = "0.1.0"
edition = "2021"
description = "Vaulet identity core: keys, DIDs, credentials, OID4VC protocol (PLAN.md D5)"
# Declared now, years before publication, because a licence added later needs the
# agreement of everyone who has committed by then — today that is one person
# (ADR 0032). It grants nothing to the rest of the repository, which stays all
# rights reserved.
license = "Apache-2.0"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# Expose `emrtd::fixtures` (synthetic CSCA/DSC/SOD builders) to downstream test
# code. Test-only: the backend enables it in dev-dependencies; never in a build.
test-fixtures = []

[dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is REQUIRED, not a nicety. Without it serde_json's default
# number scanner is a fast approximation that can land one ULP away from the
# value the JSON text denotes. The capture envelope carries ~1000 f64 landmark
# values whose decimal form comes from Dart's `double.toString()` — the shortest
# round-tripping representation, which needs 17 significant digits for roughly
# a tenth of real values. Misparsing any one of them changes the float64 bytes
# this server canonicalizes, so its recomputed bundle_hash cannot match the one
# the device signed, and an honest capture is refused as "did-jws binding
# invalid". The feature makes the parser correctly rounded.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
# Recovery-file encryption (M1 backup — PLAN.md D3).
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
# Recovery-phrase (BIP39) encoding of the P-256 scalar (ADR 0001, approach A).
bip39 = "2"
# Shamir recovery (ADR 0002): split the 32-byte scalar over GF(256).
sharks = "0.5"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
# ePassport (eMRTD) passive/active authentication (ADR 0009): CMS SignedData
# (EF.SOD), X.509 (DSC/CSCA), ASN.1 for the LDS security object, RSA/ECDSA verify.
der = { version = "0.7", features = ["oid"] }
const-oid = "0.9"
spki = "0.7"
x509-cert = "0.2"
cms = "0.2"
rsa = { version = "0.9", features = ["sha2", "sha1"] }
p384 = { version = "0.13", features = ["ecdsa"] }
# Generic ECDSA verification over explicit Weierstrass domain parameters — Thai
# (and other) ePassport DSCs embed brainpoolP256r1 as explicit params, which the
# NIST-specific p256/p384 crates can't parse and RustCrypto has no stable curve for.
num-bigint = "0.4"
ecdsa = "0.16"
# SD-JWT VC + KB-JWT mechanics (ADR 0004). SoftwareKey is the external ES256
# JwsSigner, so this crate never owns key material.
sd-jwt-payload = "0.5.1"
# Required to implement sd-jwt-payload's async JwsSigner trait.
async-trait = "0.1"
# Minimal executor to drive the (immediately-resolving) async signer from our
# sync FFI-facing functions. No real await points, so no runtime is needed.
pollster = "0.3"
mrz = "0.5.1"
openmls = "0.8"
openmls_rust_crypto = "0.5.1"
openmls_basic_credential = "0.5.0"
openmls_traits = "0.5.0"
hkdf = "0.12"
flate2 = "1.1.9"

[dev-dependencies]
tempfile = "3"

# Planned dependencies (see PLAN.md D5) — add when implementation starts:
# ssi = "0.12"                  # W3C VC, SD-JWT, did:key/jwk/web (SpruceID)  — NOT adopted, see ADR 0004
# didcomm = "0.4"               # DIDComm v2 (phase M2)
# vsss-rs = "5"                 # Shamir secret sharing (phase M3)
